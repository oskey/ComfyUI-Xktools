[project]
name = "ComfyUI-Xktools"
version = "1.0.0"
description = "ComfyUI插件：中文到英文提示词翻译工具，使用百度翻译API"
authors = [
    {name = "Xktools", email = ""}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.1"
]

[project.urls]
Homepage = "https://github.com/oskey/ComfyUI-Xktools"
Repository = "https://github.com/oskey/ComfyUI-Xktools"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"